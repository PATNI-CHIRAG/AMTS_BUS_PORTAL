version: '3.8'

services:
  db:
    image: postgis/postgis:17-3.5
    container_name: amts_postgis_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: amts_portal_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amts_portal_db && psql -U postgres -d amts_portal_db -c 'SELECT PostGIS_Full_Version();'"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amts_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-amts-portal-key-2026-safe-local
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DB_ENGINE=django.contrib.gis.db.backends.postgis
      - DB_NAME=amts_portal_db
      - DB_USER=postgres
      - DB_PASSWORD=root
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amts_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgis_data:
